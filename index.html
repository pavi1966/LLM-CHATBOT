<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local AI Chatbot</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <div class="header-content">
                <h1>Local AI Assistant</h1>
                <span class="status">● Running locally</span>
            </div>
            <div class="model-selector">
                <label for="model-select">Model:</label>
                <select id="model-select">
                    <option value="llama3.2:3b">Llama 3.2 (3B)</option>
                    <option value="mistral">Mistral</option>
                    <option value="phi3">Phi 3</option>
                    <option value="gemma">Gemma</option>
                </select>
            </div>
        </header>

        <main class="chat-box" id="chat-box">
            <div class="message ai-message">
                <div class="avatar ai-avatar">AI</div>
                <div class="message-content">
                    <p>Hello! I'm your local AI assistant running on Ollama. How can I help you today?</p>
                </div>
            </div>
        </main>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="message-input" placeholder="Message AI Assistant... (Shift+Enter for new line)" rows="1"></textarea>
                <button id="send-btn" aria-label="Send message">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    

    <script src="app.js"></script>
</body>
</html>
